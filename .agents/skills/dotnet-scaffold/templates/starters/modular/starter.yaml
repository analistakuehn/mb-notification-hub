id: modular-monolith
canonical-architecture: modular-monolith
aliases: [pragmatic-modular, pragmatic-modular-architecture]
template-set: common
title: Pragmatic Modular Architecture
host-name: Platform.Api
host-path: src/Platform.Api
infrastructure-name: Platform.Api
infrastructure-path: src/Platform.Api
features-root: src/Platform.Api/Modules
slice-shape: module-with-vertical-slices

projects:
  - { name: Platform.Api, path: src/Platform.Api, sdk: Microsoft.NET.Sdk.Web, role: host, namespace-suffix: Api, packages: "FluentValidation|FluentValidation.DependencyInjectionExtensions|Microsoft.Extensions.Http.Resilience" }
  - { name: Platform.ArchTests, path: tests/Platform.ArchTests, sdk: Microsoft.NET.Sdk, role: arch-tests, namespace-suffix: ArchTests, references: Platform.Api }
  - { name: Platform.SecurityArchTests, path: tests/Platform.SecurityArchTests, sdk: Microsoft.NET.Sdk, role: security-arch-tests, namespace-suffix: SecurityArchTests, references: Platform.Api }
  - { name: Platform.UnitTests, path: tests/Platform.UnitTests, sdk: Microsoft.NET.Sdk, role: unit-tests, namespace-suffix: UnitTests, references: Platform.Api }
  - { name: Platform.IntegrationTests, path: tests/Platform.IntegrationTests, sdk: Microsoft.NET.Sdk, role: integration-tests, namespace-suffix: IntegrationTests, references: Platform.Api }
  - { name: Platform.PerformanceTests, path: tests/Platform.PerformanceTests, sdk: Microsoft.NET.Sdk, role: performance-benchmarks, namespace-suffix: PerformanceTests, references: Platform.Api }

surfaces:
  composition: { project: Platform.Api, path: "src/Platform.Api/Composition" }
  endpoint-composition: { project: Platform.Api, path: "src/Platform.Api/Composition" }
  host-infrastructure: { project: Platform.Api, path: "src/Platform.Api/Infrastructure" }
  shared-kernel: { project: Platform.Api, path: "src/Platform.Api/Modules/SharedKernel", namespace: "SharedKernel" }
  module-context: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}" }
  domain: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/Domain" }
  features: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/Features" }
  integration: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/Integration/V1" }
  module-infrastructure: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/Infrastructure" }

registrations:
  application: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/{{ModuleName}}Module.cs", type: "{{ModuleName}}Module" }
  infrastructure: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/{{ModuleName}}Module.cs", type: "{{ModuleName}}Module" }
  endpoints: { project: Platform.Api, path: "src/Platform.Api/Modules/{{ModuleName}}/{{ModuleName}}Module.cs", type: "{{ModuleName}}Module" }

dependency-rules:
  - { id: module-domain-must-stay-technology-free, scope: "Api.Modules.*.Domain", forbid-packages: "Microsoft.AspNetCore|Microsoft.EntityFrameworkCore|MongoDB.Driver|RabbitMQ.Client|Confluent.Kafka|StackExchange.Redis" }
  - { id: shared-kernel-must-stay-technology-free, scope: "SharedKernel", forbid-packages: "Microsoft.AspNetCore|Microsoft.EntityFrameworkCore|MongoDB.Driver|RabbitMQ.Client|Confluent.Kafka|StackExchange.Redis" }
